<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatToWear - 내 옷장</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="main-body">

<nav class="navbar">
    <a href="wardrobe.html" class="nav-item active">옷장</a>
    <a href="main.html" class="nav-item">홈</a>
    <a href="mypage.html" class="nav-item">마이</a>
</nav>

<div class="container main-container">
    <div class="wardrobe-card">

        <div class="wardrobe-header">
            <h2>👗 내 옷장 관리</h2>
            <button class="add-clothes-btn" onclick="location.href='add_clothes.html'">+ 새로운 옷 등록하기</button>
        </div>

        <div class="clothes-list" id="clothes-container">
            <div class="clothes-item">
                <span class="clothes-name">데이터를 불러오는 중...</span>
            </div>
        </div>

    </div>
</div>

<script>
    // 1. 화면이 켜질 때 실행되는 함수
    window.onload = function() {
        let loginId = localStorage.getItem('loggedInUser');

        // 로그인 안 했으면 로그인 화면으로 쫓아내기
        if (!loginId) {
            alert("로그인이 필요합니다.");
            window.location.href = 'index.html';
            return;
        }

        loginId = loginId.replace(/['"]/g, '').trim();

        // 내 옷장 데이터 불러오기
        fetchClothes(loginId);
    };

    // 2. 백엔드에서 내 옷 목록을 가져오는  통신 로직
    function fetchClothes(loginId) {
        const container = document.getElementById('clothes-container');
        container.innerHTML = '<div class="clothes-item"><span class="clothes-name">옷장을 불러오는 중...</span></div>';

        // 백엔드 API 호출
        fetch(`/api/main/clothes?loginId=${loginId}`, {
            method: 'GET'
        })
            .then(response => {
                if (!response.ok) throw new Error("옷장 데이터를 불러오는데 실패했습니다.");
                return response.json();
            })
            .then(clothes => {
                container.innerHTML = '';

                // 옷장이 비어있을 때
                if (clothes.length === 0) {
                    container.innerHTML = '<div class="clothes-item"><span class="clothes-name">옷장이 비어있습니다. 새 옷을 등록해보세요! 👕</span></div>';
                    return;
                }

                // DB에서 가져온 옷들을 화면에 하나씩
                clothes.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'clothes-item';

                    itemDiv.innerHTML = `
                    <span class="clothes-name">${item.name}</span>
                    <button class="more-btn" onclick="deleteCloth(${item.id})">🗑️</button>
                `;
                    container.appendChild(itemDiv);
                });
            })
            .catch(error => {
                console.error('Error:', error);
                container.innerHTML = `<div class="clothes-item"><span class="clothes-name" style="color:red;">서버와 연결할 수 없습니다.</span></div>`;
            });
    }

    // 3. 백엔드 DB에서 진짜로 옷을 삭제하는 통신 로직
    function deleteCloth(clothesId) {
        if(confirm("이 옷을 옷장에서 정말 삭제할까요?")) {

            // 백엔드 API 호출
            fetch(`/api/main/clothes/${clothesId}`, {
                method: 'DELETE'
            })
                .then(response => {
                    if(response.ok) {
                        alert("옷이 성공적으로 삭제되었습니다.");
                        location.reload(); // 성공하면 새로고침해서 바뀐 리스트 띄우기
                    } else {
                        throw new Error("옷 삭제에 실패했습니다.");
                    }
                })
                .catch(error => {
                    alert(error.message);
                    console.error('Error:', error);
                });
        }
    }
</script>
</body>
</html>
