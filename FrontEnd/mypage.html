<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatToWear - 마이페이지</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="main-body">

<nav class="navbar">
    <a href="wardrobe.html" class="nav-item">옷장</a>
    <a href="main.html" class="nav-item">홈</a>
    <a href="mypage.html" class="nav-item active">마이</a>
</nav>

<div class="container main-container">
    <div class="wardrobe-card">
        <div class="mypage-content">
            <h2 class="welcome-msg">안녕하세요! <span class="user-name" id="display-nickname">회원</span>님!</h2>

            <div class="info-section">
                <div class="constitution-info-box" style="margin-bottom: 15px;">
                    <p class="info-label" style="font-size: 14px; color: #777; margin-bottom: 4px;">
                        기본 체질 : <span class="info-value" id="display-base-constitution" style="font-weight: normal;">불러오는 중...</span>
                    </p>
                    <p class="info-label" style="font-size: 16px;">
                        현재 내 체질 : <span class="info-value" id="display-constitution" style="font-weight: bold; color: #333;">불러오는 중...</span>
                    </p>
                </div>

                <div class="constitution-slider-wrapper">
                    <div class="slider-track">
                        <div class="slider-dot blue" id="dot--2"></div>
                        <div class="slider-dot blue" id="dot--1"></div>
                        <div class="slider-dot center" id="dot-0"></div>
                        <div class="slider-dot red" id="dot-1"></div>
                        <div class="slider-dot red" id="dot-2"></div>
                    </div>
                </div>
            </div>

            <div class="info-section">
                <p class="info-label">현재 설정된 지역</p>
                <p class="location-name" id="display-location">📍 대구광역시</p>
            </div>

            <div class="mypage-buttons">
                <button class="sub-btn" onclick="location.href='constitution.html'">내 체질 다시 설정하기</button>
                <button class="sub-btn" onclick="execDaumPostcodeForUpdate()">위치 정보 수정하기</button>
                <button class="logout-link" onclick="logout()">로그아웃</button>
            </div>
        </div>
    </div>
</div>

<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<script>
    window.onload = function() {
        let loginId = localStorage.getItem('loggedInUser');

        if (loginId) {
            loginId = loginId.replace(/['"]/g, '').trim();

            // 1. 닉네임 가져오기
            fetch(`/api/main/member/nickname?loginId=${loginId}`)
                .then(response => {
                    if(response.ok) return response.text();
                    throw new Error("닉네임 못 가져옴");
                })
                .then(realNickname => {
                    document.getElementById('display-nickname').innerText = realNickname;
                })
                .catch(error => {
                    console.log("닉네임 가져오기 실패:", error);
                    document.getElementById('display-nickname').innerText = "회원";
                });

            // 🌟 2. [수정됨] 백엔드에서 기본 체질과 현재 체질 데이터를 정확하게 가져옵니다!
            fetch(`/api/main/member/constitution?loginId=${loginId}`)
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error("체질 정보 가져오기 실패");
                })
                .then(data => {
                    const baseWeight = data.baseWeight;
                    const currentWeight = data.currentWeight;

                    // 값에 맞는 텍스트를 반환하는 함수 (피드백으로 소수점이 되었을 경우를 대비해 반올림 처리)
                    const getConstitutionText = (value) => {
                        const rounded = Math.round(value);
                        if (rounded <= -2) return "❄️ 매우 추위를 많이 탐";
                        if (rounded === -1) return "🧊 추위를 조금 탐";
                        if (rounded === 0) return "☁️ 보통 / 잘 모름";
                        if (rounded === 1) return "☀️ 더위를 조금 탐";
                        if (rounded >= 2) return "🔥 더위를 매우 많이 탐";
                        return "☁️ 보통 / 잘 모름";
                    };

                    // 화면 글자 업데이트
                    document.getElementById('display-base-constitution').innerText = getConstitutionText(baseWeight);
                    document.getElementById('display-constitution').innerText = getConstitutionText(currentWeight);

                    // 슬라이더 점(dot) 위치 업데이트 (현재 체질 기준)
                    document.querySelectorAll('.slider-dot').forEach(dot => {
                        dot.classList.remove('active');
                    });

                    // 피드백으로 체질이 1.5가 되어도 2번 점에 불이 들어오도록 반올림
                    const activeDotId = 'dot-' + Math.round(currentWeight);
                    const activeDot = document.getElementById(activeDotId);
                    if (activeDot) {
                        activeDot.classList.add('active');
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById('display-base-constitution').innerText = "오류 발생";
                    document.getElementById('display-constitution').innerText = "오류 발생";
                });
        }

        const savedLocation = localStorage.getItem('user_location') || "대구광역시";
        document.getElementById('display-location').innerText = '📍 ' + savedLocation;
    };

    function execDaumPostcodeForUpdate() {
        new daum.Postcode({
            oncomplete: function(data) {
                var addr = '';

                if (data.userSelectedType === 'R') {
                    addr = data.roadAddress;
                } else {
                    addr = data.jibunAddress;
                }

                document.getElementById('display-location').innerText = '📍 ' + addr;
                localStorage.setItem('user_location', addr);

                let loginId = localStorage.getItem('loggedInUser');
                if (loginId) {
                    loginId = loginId.replace(/['"]/g, '').trim();

                    fetch('/api/members/location', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            loginId: loginId,
                            location: addr
                        })
                    })
                        .then(response => {
                            if (response.ok) {
                                alert("위치 정보가 성공적으로 수정되었습니다!");
                            } else {
                                throw new Error("위치 정보 수정 실패");
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                        });
                }
            }
        }).open();
    }

    function logout() {
        if(confirm("로그아웃 하시겠습니까?")) {
            localStorage.clear();
            location.href = 'index.html';
        }
    }
</script>
</body>
</html>
