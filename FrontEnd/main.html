<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatToWear - 홈</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .edit-temp-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            margin-left: 8px;
            vertical-align: middle;
            transition: transform 0.2s ease;
        }
        .edit-temp-btn:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body class="main-body">

<nav class="navbar">
    <a href="wardrobe.html" class="nav-item">옷장</a>
    <a href="main.html" class="nav-item active">홈</a>
    <a href="mypage.html" class="nav-item">마이</a>
</nav>

<div class="container main-container">
    <div class="login-card main-card">

        <div class="temp-display">
            <h2>
                🌡️ 현재 기온 : <span id="current-temp">--</span>°C <span id="weather-icon">☁️</span>
                <button type="button" class="edit-temp-btn" onclick="editTemperature()" title="기온 수동 입력">✏️</button>
            </h2>
        </div>

        <form id="recommendForm">
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" id="workout" name="tpo" value="workout">
                    <label for="workout">🏃 운동</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="daily" name="tpo" value="daily" checked>
                    <label for="daily">🎒 일상 / 학교</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="formal" name="tpo" value="formal">
                    <label for="formal">👔 격식 / 출근</label>
                </div>
            </div>

            <button type="submit" class="login-btn main-action-btn">오늘의 옷차림 추천받기</button>
        </form>

        <div class="recommendation-box">
            <p class="clothes-result" id="recommend-result">여기에 추천 결과가 표시됩니다.</p>
            <p class="weather-tip" id="weather-tip-msg">💡 날씨 데이터를 불러오고 있어요...</p>

            <p style="font-size: 12px; color: #888; margin-top: 12px; border-top: 1px dashed #ccc; padding-top: 8px;">
                ※ 위 추천 옷차림은 회원님의 옷장에 등록된 옷을 기반으로 분석한 결과입니다.
            </p>
        </div>

        <button class="feedback-btn">피드백 남기기</button>

    </div>
</div>

<div id="feedbackModal" class="modal-overlay">
    <div class="modal-content">
        <h3><span id="user-nickname">회원</span>님, 오늘 추천받은 옷차림은 어떠셨나요?</h3>
        <p class="modal-subtitle">피드백은 더 정확한 추천에 도움이 됩니다.</p>

        <form id="feedbackForm">
            <div class="radio-group vertical">
                <div class="radio-option">
                    <input type="radio" id="f-very-cold" name="feedback-pref" value="-2" required>
                    <label for="f-very-cold">❄️ 매우 춥게 느껴짐</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="f-cold" name="feedback-pref" value="-1">
                    <label for="f-cold">🧊 조금 춥게 느껴짐</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="f-normal" name="feedback-pref" value="0" checked>
                    <label for="f-normal">☁️ 적당함 / 보통</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="f-hot" name="feedback-pref" value="1">
                    <label for="f-hot">☀️ 조금 덥게 느껴짐</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="f-very-hot" name="feedback-pref" value="2">
                    <label for="f-very-hot">🔥 매우 덥게 느껴짐</label>
                </div>
            </div>

            <button type="submit" class="main-action-btn">피드백 보내고 가중치 업데이트</button>
            <button type="button" class="close-modal-btn" onclick="skipFeedback()">피드백 건너뛰기</button>
        </form>
    </div>
</div>

<script>
    let pendingFeedback = false;

    window.onload = function() {
        let loggedInUser = localStorage.getItem('loggedInUser');

        if (!loggedInUser) {
            alert("로그인이 필요합니다!");
            window.location.href = 'index.html';
            return;
        }

        loggedInUser = loggedInUser.replace(/['"]/g, '').trim();

        fetch(`/api/main/member/nickname?loginId=${loggedInUser}`)
            .then(response => {
                if(response.ok) return response.text();
                throw new Error("닉네임 못 가져옴");
            })
            .then(realNickname => {
                const nicknameElement = document.getElementById('user-nickname');
                if(nicknameElement) {
                    nicknameElement.innerText = realNickname;
                }
            })
            .catch(error => {
                console.log("닉네임 가져오기 실패:", error);
                document.getElementById('user-nickname').innerText = "회원";
            });

        const myLocation = localStorage.getItem('user_location') || "대구광역시 남구 대명동";

        fetch(`/api/main/weather?location=${encodeURIComponent(myLocation)}`)
            .then(response => {
                if(!response.ok) throw new Error("날씨 가져오기 실패");
                return response.json();
            })
            .then(data => {
                console.log("받아온 날씨 데이터:", data);

                // 1. 기온 띄우기
                document.getElementById('current-temp').innerText = data.currentTemp;

                // 2. 🌟 백엔드에서 준 아이콘(skyStatus)으로 덮어쓰기! 🌟
                if (data.skyStatus) {
                    document.getElementById('weather-icon').innerText = data.skyStatus;

                    // 아이콘에 따라 아래 팁 메시지도 동적으로 바꿔주면 더 좋습니다!
                    let tipMsg = "💡 외출하기 좋은 날씨네요!";
                    if (data.skyStatus === "☔" || data.skyStatus === "🌨️") {
                        tipMsg = "💡 우산을 꼭 챙기세요! ☔";
                    } else if (data.skyStatus === "⛄") {
                        tipMsg = "💡 눈이 오고 있어요. 길이 미끄러울 수 있으니 주의하세요! ⛄";
                    }
                    document.getElementById('weather-tip-msg').innerText = tipMsg;
                }
            })
            .catch(error => {
                console.error("날씨 불러오기 에러:", error);
                document.getElementById('current-temp').innerText = "20";
                document.getElementById('weather-icon').innerText = "☁️";
            });
    };

    // 2. 오늘의 옷차림 추천받기 로직 (백엔드 연동)
    document.getElementById('recommendForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // 🌟 수정된 부분: 피드백 대기 중이면 알림을 띄우고 여기서 함수를 아예 멈춰버림(return)!
        if (pendingFeedback) {
            alert("💡 이전 추천에 대한 피드백을 먼저 남겨주세요! (건너뛰기도 가능합니다)");
            return; // ⛔ 여기가 빠져있어서 계속 진행됐던 겁니다!
        }

        const loginId = localStorage.getItem('loggedInUser').replace(/['"]/g, '').trim();
        const tpo = document.querySelector('input[name="tpo"]:checked').value;
        const currentTemp = document.getElementById('current-temp').innerText;

        fetch(`/api/main/recommendations?loginId=${loginId}&temperature=${currentTemp}&tpo=${tpo}`, {
            method: 'GET'
        })
            .then(response => {
                if (!response.ok) throw new Error("추천을 가져오는데 실패했습니다.");
                return response.text();
            })
            .then(message => {
                document.getElementById('recommend-result').innerHTML = message;
                alert("추천이 완료되었습니다!");
                pendingFeedback = true;
            })
            .catch(error => {
                console.error('Error:', error);
                alert(error.message);
            });
    });

    function openModal() {
        if (!pendingFeedback) {
            alert("먼저 오늘의 옷차림을 추천받아주세요! 👕");
            return;
        }
        document.getElementById('feedbackModal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('feedbackModal').classList.remove('show');
    }

    function skipFeedback() {
        pendingFeedback = false;
        closeModal();
    }
    document.querySelector('.feedback-btn').onclick = openModal;

    document.getElementById('feedbackForm').onsubmit = function(e) {
        e.preventDefault();

        const loginId = localStorage.getItem('loggedInUser').replace(/['"]/g, '').trim();
        const score = document.querySelector('input[name="feedback-pref"]:checked').value;
        const currentTemp = document.getElementById('current-temp').innerText;

        const feedbackData = {
            loginId: loginId,
            tempAtTime: parseFloat(currentTemp),
            score: parseInt(score)
        };

        fetch('/api/main/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(feedbackData)
        })
            .then(response => {
                if (!response.ok) throw new Error("피드백 전송 실패");
                return response.text();
            })
            .then(message => {
                alert(message);
                pendingFeedback = false;
                closeModal();
            })
            .catch(error => {
                console.error('Error:', error);
                alert(error.message);
            });
    };

    function editTemperature() {
        let newTemp = prompt("현재 기온을 숫자로 직접 입력해주세요 (예: 22):", "");
        if (newTemp !== null && newTemp.trim() !== "" && !isNaN(newTemp)) {
            document.getElementById('current-temp').innerText = newTemp;
            alert("기온이 " + newTemp + "°C로 수동 설정되었습니다.");
        }
    }
</script>
</body>
</html>
